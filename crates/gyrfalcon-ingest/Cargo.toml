[package]
name = "gyrfalcon-ingest"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Files to text for Gyrfalcon: PDF through PDFium with a layout layer, HTML, and plain text."

[dependencies]
thiserror = "2"
# PDFium is loaded at run time (GYR_PDFIUM, beside the executable, or the system library path),
# so builds download nothing and a collection without PDFs never needs it.
pdfium-render = { version = "0.9.4", default-features = false, features = ["thread_safe", "pdfium_latest"] }
