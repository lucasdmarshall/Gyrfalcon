[package]
name = "gyrfalcon"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Sealed-segment hybrid retrieval: an owned BM25 index and a graph-free dense cascade, fused."
readme = "README.md"
repository = "https://github.com/lucasdmarshall/gyrfalcon"
keywords = ["search", "bm25", "embeddings", "retrieval", "rag"]
categories = ["text-processing", "science::ml"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
unicode-normalization = "0.1"
bitpacking = "0.9"
lz4_flex = "0.14"
rustc-hash = "2"
memmap2 = "0.9"
# ONNX Runtime is loaded at run time (ORT_DYLIB_PATH or the system library path), so builds
# do not download prebuilt binaries.
ort = { version = "2.0.0-rc.15", default-features = false, features = ["load-dynamic", "std", "cuda", "openvino"] }
tokenizers = { version = "0.23", default-features = false, features = ["fancy-regex"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
webpki-roots = "1"
sha2 = "0.10"
unicode-general-category = "1.1"
crc32fast = "1"
frostem = { version = "1", default-features = false, features = ["english"] }

[dev-dependencies]
# The reference implementations tests and examples compare against.
regex = "1"
simsimd = "6.5"
tantivy = "0.27"
usearch = "2.26"
