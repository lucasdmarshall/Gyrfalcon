[package]
name = "gyrfalcon"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Sealed-segment hybrid retrieval: Tantivy BM25 and USearch HNSW fused with RRF."

[dependencies]
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
unicode-normalization = "0.1"
tantivy = "0.27"
usearch = "2.26"
memmap2 = "0.9"
simsimd = "6.5"
# ONNX Runtime is loaded at run time (ORT_DYLIB_PATH or the system library path), so builds
# do not download prebuilt binaries.
ort = { version = "2.0.0-rc.15", default-features = false, features = ["load-dynamic", "std"] }
tokenizers = { version = "0.23", default-features = false, features = ["fancy-regex"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
webpki-roots = "1"
