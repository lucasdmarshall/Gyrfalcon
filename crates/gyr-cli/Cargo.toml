[package]
name = "gyr-cli"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "The gyr command: index, query, serve, compact, and bench a Gyrfalcon collection."

[[bin]]
name = "gyr"
path = "src/main.rs"

[dependencies]
gyrfalcon = { path = "../gyrfalcon" }
gyrfalcon-ingest = { path = "../gyrfalcon-ingest" }
clap = { version = "4", features = ["derive", "env"] }
serde_json = "1"
tempfile = "3"
