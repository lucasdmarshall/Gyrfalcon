[package]
name = "gyr-cli"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "The gyr command: index, query, serve, compact, and bench a Gyrfalcon collection."
readme = "README.md"
repository = "https://github.com/lucasdmarshall/gyrfalcon"
keywords = ["search", "cli", "bm25", "retrieval", "rag"]
categories = ["command-line-utilities"]

[[bin]]
name = "gyr"
path = "src/main.rs"

[dependencies]
gyrfalcon = { version = "0.1.0", path = "../gyrfalcon" }
gyrfalcon-ingest = { version = "0.1.0", path = "../gyrfalcon-ingest" }
clap = { version = "4", features = ["derive", "env"] }
serde_json = "1"
tempfile = "3"
