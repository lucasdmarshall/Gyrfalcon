[package]
name = "gyrfalcon-py"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Python bindings for Gyrfalcon: the gyrfalcon package's native module."
publish = false

[lib]
name = "_native"
crate-type = ["cdylib"]

[dependencies]
gyrfalcon = { path = "../gyrfalcon" }
gyrfalcon-ingest = { path = "../gyrfalcon-ingest" }
pyo3 = { version = "0.30", features = ["abi3-py39"] }

[features]
# maturin turns this on; plain cargo builds link against libpython instead.
extension-module = ["pyo3/extension-module"]
