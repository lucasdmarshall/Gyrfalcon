<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 306" width="1000" height="306" role="img" aria-label="Gyrfalcon against LlamaIndex, Haystack, and LangChain on FiQA: nDCG@10, index time, query latency, peak memory">
<style>
